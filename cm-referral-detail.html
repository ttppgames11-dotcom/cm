<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>संदर्भ सविस्तर ट्रॅक (Referral Details) — Connect Maratha</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/cm-data.js" defer></script>
  <script src="assets/js/cm-connect.js" defer></script>
</head>
<body>
  <header class="navbar container">
    <div class="logo">
      <a href="cm-home.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px;">
        <span class="flag">🚩</span>
        <span>कनेक्ट मराठा</span>
      </a>
    </div>
    <nav class="nav-links">
      <a href="cm-home.html">मुख्य पृष्ठ</a>
      <a href="cm-business-directory.html">व्यवसाय</a>
      <a href="cm-business-sangam.html">व्यवसाय संगम</a>
      <a href="cm-referrals.html" class="active">संदर्भ (Referrals)</a>
    </nav>
    <div class="user-actions">
      <a href="cm-referrals.html" class="btn btn-outline">← सर्व संदर्भ</a>
    </div>
  </header>

  <main class="container py-4" style="max-width: 900px;">
    <div id="referralDetailCard" class="form-card">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <footer class="footer mt-5 text-center py-3">
    <p>© २०२६ कनेक्ट मराठा — व्यवसाय संदर्भ CRM इंजिन</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const refId = urlParams.get('id') || 'CM-000182';
      renderDetail(refId);
    });

    function renderDetail(id) {
      const card = document.getElementById('referralDetailCard');
      const ref = CMDB.getReferral(id) || CMDB.listReferrals()[0];

      if (!ref) {
        card.innerHTML = `<h3>संदर्भ सापडला नाही</h3><a href="cm-referrals.html" class="btn btn-primary mt-3">परत जा</a>`;
        return;
      }

      const creator = CMDB.getMember(ref.creator) || { name: 'अमोल जाधव', business: 'सह्याद्री टेक', city: 'पुणे' };
      const recipient = CMDB.getMember(ref.recipient) || { name: 'प्रिया देशमुख', business: 'देशमुख अँड असोसिएट्स', city: 'मुंबई' };

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:16px; margin-bottom:20px;">
          <div>
            <span class="badge badge-primary">${ref.id}</span>
            <span class="badge badge-warning" style="margin-left:6px;">${ref.category}</span>
            <h2 style="color:var(--maroon-900); margin-top:8px;">${ref.prospect}</h2>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.85rem; color:#D84315;">अंदाजित मूल्य</div>
            <div style="font-size:1.8rem; font-weight:800; color:var(--maroon-900);">₹${(ref.actualValue || ref.estimatedValue || 0).toLocaleString('en-IN')}</div>
          </div>
        </div>

        <!-- CRM Pipeline Tracker -->
        <h4 style="margin-bottom:12px; color:var(--maroon-900);">📊 CRM पाईपलाईन ट्रॅकर (Referral Pipeline Stage)</h4>
        <div style="display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:16px; border-radius:8px; margin-bottom:24px; position:relative;">
          <div class="stage-step ${['New','Contacted','Qualified','Proposal','Won'].includes(ref.status)?'active':''}">
            <div style="font-weight:700;">१. नवीन (New)</div>
            <small>संदर्भ प्राप्त</small>
          </div>
          <div>➔</div>
          <div class="stage-step ${['Contacted','Qualified','Proposal','Won'].includes(ref.status)?'active':''}">
            <div style="font-weight:700;">२. संपर्क (Contacted)</div>
            <small>ग्राहकाशी बोलणे</small>
          </div>
          <div>➔</div>
          <div class="stage-step ${['Qualified','Proposal','Won'].includes(ref.status)?'active':''}">
            <div style="font-weight:700;">३. पात्र (Qualified)</div>
            <small>गरज निश्चित</small>
          </div>
          <div>➔</div>
          <div class="stage-step ${['Proposal','Won'].includes(ref.status)?'active':''}">
            <div style="font-weight:700;">४. प्रस्ताव (Proposal)</div>
            <small>कोटेशन पाठवले</small>
          </div>
          <div>➔</div>
          <div class="stage-step ${ref.status === 'Won'?'won':''}">
            <div style="font-weight:700;">५. बंद सौदा (Won ₹)</div>
            <small>व्यवसाय पूर्ण</small>
          </div>
        </div>

        <div class="grid grid-2" style="gap:20px; margin-bottom:24px;">
          <div style="background:#FFFFFF; padding:16px; border-radius:8px;">
            <h4 style="color:#e65100; margin-bottom:8px;">👤 संदर्भ देणारे सदस्य</h4>
            <p><strong>नाव:</strong> ${creator.name}</p>
            <p><strong>व्यवसाय:</strong> ${creator.business || creator.profession}</p>
            <p><strong>शहर:</strong> ${creator.city}</p>
          </div>
          <div style="background:#e8f5e9; padding:16px; border-radius:8px;">
            <h4 style="color:#F4511E; margin-bottom:8px;">🏢 संदर्भ प्राप्तकर्ते उद्योजक</h4>
            <p><strong>नाव:</strong> ${recipient.name}</p>
            <p><strong>व्यवसाय:</strong> ${recipient.business || recipient.profession}</p>
            <p><strong>शहर:</strong> ${recipient.city}</p>
          </div>
        </div>

        <div style="margin-bottom:24px;">
          <h4>📝 व्यवसायाची गरज व माहिती</h4>
          <p style="background:#f5f5f5; padding:14px; border-radius:6px; border-left:4px solid var(--maroon-700); margin-top:8px;">${ref.requirement}</p>
        </div>

        <!-- Status Update Controls -->
        <div style="background:#f1f3f5; padding:20px; border-radius:8px;">
          <h4 style="margin-bottom:12px; color:var(--maroon-900);">⚙️ स्थिती अपडेट करा (Update Pipeline Status)</h4>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button class="btn btn-outline" onclick="changeStatus('${ref.id}', 'Contacted')">संपर्क साधला (Contacted)</button>
            <button class="btn btn-outline" onclick="changeStatus('${ref.id}', 'Qualified')">पात्र ठरले (Qualified)</button>
            <button class="btn btn-warning" onclick="changeStatus('${ref.id}', 'Proposal')">प्रस्ताव पाठवला (Proposal)</button>
            <button class="btn btn-success" onclick="closeWon('${ref.id}')">🎉 सौदा यशस्वी बंद (Closed Won ₹)</button>
            <button class="btn btn-danger" onclick="changeStatus('${ref.id}', 'Lost')">अपूर्ण / रद्द (Closed Lost)</button>
          </div>
        </div>
      `;
    }

    function changeStatus(id, newStatus) {
      CMDB.updateReferralStatus(id, newStatus);
      alert('✅ स्थिती अद्ययावत केली: ' + newStatus);
      renderDetail(id);
    }

    function closeWon(id) {
      const amountStr = prompt('कृपया बंद झालेल्या सौद्याची प्रत्यक्ष किंमत (Actual Revenue Amount in ₹) प्रविष्ट करा:', '२५००००');
      if (amountStr !== null) {
        const val = parseFloat(amountStr) || 0;
        CMDB.updateReferralStatus(id, 'Won', val, 'सौदा यशस्वीरीत्या बंद झाला!');
        alert('🎉 अभिनंदन! ₹' + val.toLocaleString('en-IN') + ' चा सौदा यशस्वीरीत्या बंद झाला आहे.');
        renderDetail(id);
      }
    }
  </script>

  <style>
    .stage-step { text-align: center; font-size: 0.85rem; color: #D84315; }
    .stage-step.active { color: var(--maroon-900); }
    .stage-step.won { color: #F4511E; font-weight: bold; }
  </style>
</body>
</html>
