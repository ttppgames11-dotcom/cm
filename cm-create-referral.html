<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नवीन व्यवसाय संदर्भ द्या (Give Referral) — Connect Maratha</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/cm-data.js" defer></script>
  <script src="assets/js/cm-connect.js" defer></script>
</head>
<body>
  <header class="navbar container">
    <div class="logo">
      <a href="cm-home.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px;">
        <span class="flag">🚩</span>
        <span>कनेक्ट मराठा</span>
      </a>
    </div>
    <nav class="nav-links">
      <a href="cm-home.html">मुख्य पृष्ठ</a>
      <a href="cm-business-directory.html">व्यवसाय</a>
      <a href="cm-business-sangam.html">व्यवसाय संगम</a>
      <a href="cm-referrals.html">संदर्भ (Referrals)</a>
    </nav>
    <div class="user-actions">
      <a href="cm-referrals.html" class="btn btn-outline">← मागे जा</a>
    </div>
  </header>

  <main class="container py-4" style="max-width: 800px;">
    <div class="form-card">
      <h2 style="color: var(--maroon-900); margin-bottom: 6px;">🤝 नवीन व्यवसाय संदर्भ नोंदवा (Give Referral)</h2>
      <p style="color: #D84315; margin-bottom: 24px;">तुमच्या संपर्कातील संभाव्य ग्राहकाची माहिती समाज बांधवाला देऊन व्यवसाय वृद्धीस मदत करा.</p>

      <form id="createReferralForm" onsubmit="handleReferralSubmit(event)">
        <div class="field" style="margin-bottom: 16px;">
          <label style="font-weight:600; display:block; margin-bottom:6px;">१. संदर्भ प्राप्तकर्ता सदस्य (Target Member / Provider)</label>
          <select id="refRecipient" class="form-control" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #FFFFFF;">
            <option value="M1002">प्रिया देशमुख — देशमुख अँड असोसिएट्स (Chartered Accountant)</option>
            <option value="M1001">अमोल जाधव — सह्याद्री टेक (Web & Software)</option>
            <option value="M1008">विकास गायकवाड — गायकवाड इंडस्ट्रीज (Manufacturing)</option>
            <option value="M1003">रोहित मोरे — सह्याद्री ट्रेकर्स क्लब (Tourism)</option>
            <option value="M1007">मयुरी कदम — लीगल अ‍ॅडव्हायझरी (Legal Advisor)</option>
          </select>
        </div>

        <div class="field" style="margin-bottom: 16px;">
          <label style="font-weight:600; display:block; margin-bottom:6px;">२. ग्राहक / कंपनीचे नाव (Prospect Client Name)</label>
          <input type="text" id="refProspect" class="form-control" placeholder="उदा. केदारनाथ एंटरप्रायझेस / राहुल कदम" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #FFFFFF;">
        </div>

        <div class="grid grid-2" style="gap: 16px; margin-bottom: 16px;">
          <div>
            <label style="font-weight:600; display:block; margin-bottom:6px;">३. ग्राहक संपर्क क्रमांक (Phone Number)</label>
            <input type="tel" id="refPhone" class="form-control" placeholder="९८७६५४३२१०" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #FFFFFF;">
          </div>
          <div>
            <label style="font-weight:600; display:block; margin-bottom:6px;">४. स्थान (City / Location)</label>
            <input type="text" id="refLocation" class="form-control" placeholder="पुणे / मुंबई / नाशिक" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #FFFFFF;">
          </div>
        </div>

        <div class="grid grid-2" style="gap: 16px; margin-bottom: 16px;">
          <div>
            <label style="font-weight:600; display:block; margin-bottom:6px;">५. श्रेणी (Category)</label>
            <select id="refCategory" class="form-control" style="width:100%; padding:10px; border-radius:6px; border:1px solid #FFFFFF;">
              <option value="CA / Tax">CA / Tax Services</option>
              <option value="Web & Software">Web & Software Development</option>
              <option value="Interior & Construction">Interior & Construction</option>
              <option value="Legal Advisory">Legal Advisory</option>
              <option value="Manufacturing">Manufacturing / Supply</option>
              <option value="Other">इतर (Other)</option>
            </select>
          </div>
          <div>
            <label style="font-weight:600; display:block; margin-bottom:6px;">६. अंदाजित व्यवसाय मूल्य (Estimated Deal Value in ₹)</label>
            <input type="number" id="refValue" class="form-control" placeholder="५००००" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #FFFFFF;">
          </div>
        </div>

        <div class="field" style="margin-bottom: 16px;">
          <label style="font-weight:600; display:block; margin-bottom:6px;">७. व्यवसायाची सविस्तर गरज (Business Requirement Details)</label>
          <textarea id="refRequirement" rows="4" class="form-control" placeholder="ग्राहकाची नक्की काय गरज आहे व आपण काय संवाद साधला आहे?" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #FFFFFF;"></textarea>
        </div>

        <div class="field" style="margin-bottom: 20px;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="refPermission" checked style="width:18px; height:18px;">
            <span>ग्राहकाने संपर्क साधण्याची संमती दिली आहे (Permission to Contact Granted)</span>
          </label>
        </div>

        <div style="display:flex; gap:12px;">
          <button type="submit" class="btn btn-primary" style="flex:1; padding:12px; font-weight:700;">🚀 संदर्भ सबमिट करा (Submit Referral)</button>
          <a href="cm-referrals.html" class="btn btn-outline" style="padding:12px 24px;">रद्द करा</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer mt-5 text-center py-3">
    <p>© २०२६ कनेक्ट मराठा — व्यवसाय संगम व संदर्भ इंजिन</p>
  </footer>

  <script>
    function handleReferralSubmit(e) {
      e.preventDefault();
      const recipient = document.getElementById('refRecipient').value;
      const prospect = document.getElementById('refProspect').value;
      const phone = document.getElementById('refPhone').value;
      const location = document.getElementById('refLocation').value;
      const category = document.getElementById('refCategory').value;
      const estimatedValue = parseFloat(document.getElementById('refValue').value) || 0;
      const requirement = document.getElementById('refRequirement').value;
      const permission = document.getElementById('refPermission').checked;

      const newRef = CMDB.createReferral({
        recipient,
        prospect: prospect + ' (' + phone + ')',
        requirement,
        category,
        location,
        estimatedValue,
        permissionToContact: permission,
        status: 'New'
      });

      alert('✅ नवीन व्यवसाय संदर्भ यशस्वीरीत्या पाठवला गेला आहे!');
      window.location.href = 'cm-referrals.html';
    }
  </script>
</body>
</html>
