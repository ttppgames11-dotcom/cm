# Connect Maratha High-Performance Production Nginx Load Balancer Configuration
# Handles 10,00,000+ Concurrent Visitors with Zero Data Mixing and Sub-millisecond Routing

user nginx;
worker_processes auto;
worker_rlimit_nofile 1048576; # Support over 1M open file descriptors

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging with high-resolution timing
    log_format cm_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr"'
    '}';

    access_log /var/log/nginx/cm_access.log cm_json buffer=64k flush=5s;
    error_log  /var/log/nginx/cm_error.log warn;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off; # Hide Nginx version

    # Connection Timeouts
    keepalive_timeout 65;
    keepalive_requests 100000;
    client_body_timeout 15;
    client_header_timeout 15;
    send_timeout 15;

    # Buffer Sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Anti-DDoS Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=cm_api_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=cm_auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=cm_conn_limit:20m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # ==========================================
    # UPSTREAM CLUSTER (Multi-Instance Node Pool)
    # ==========================================
    upstream connect_maratha_cluster {
        least_conn; # Route to instance with fewest active requests

        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:5003 max_fails=3 fail_timeout=10s weight=1;

        # Keepalive connection pool (re-uses existing TCP sockets)
        keepalive 128;
    }

    # ==========================================
    # HTTP -> HTTPS REDIRECT SERVER
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name connectmaratha.org www.connectmaratha.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================
    # PRIMARY HIGH-SECURITY HTTPS LOAD BALANCER
    # ==========================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name connectmaratha.org www.connectmaratha.org;

        # SSL Configuration
        # ssl_certificate     /etc/letsencrypt/live/connectmaratha.org/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/connectmaratha.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Strict Connection Limits per IP
        limit_conn cm_conn_limit 50;

        # API Authentication Protection (Brute Force Guard)
        location /api/auth/ {
            limit_req zone=cm_auth_limit burst=10 nodelay;
            proxy_pass http://connect_maratha_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # API Proxy with Load Balancing
        location /api/ {
            limit_req zone=cm_api_limit burst=40 nodelay;
            proxy_pass http://connect_maratha_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Next upstream failover
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
        }

        # Static Assets Caching
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
            root /var/www/connect-maratha/frontend/dist;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend Single Page App Fallback
        location / {
            root /var/www/connect-maratha/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
