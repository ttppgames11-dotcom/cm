server:
  # 5001 so it can run next to the Node backend (5000) while both exist.
  port: ${PORT:5001}
  forward-headers-strategy: framework   # behind nginx / Cloudflare, like Node's trust proxy

app:
  jwt-secret: ${JWT_SECRET:}
  production: ${APP_PRODUCTION:false}
  # Same names and defaults as the Node backend's rate limiter.
  rate-limit:
    public-window-ms: ${RATE_LIMIT_PUBLIC_WINDOW_MS:900000}
    public-max: ${RATE_LIMIT_PUBLIC_MAX:100}
    user-window-ms: ${RATE_LIMIT_USER_WINDOW_MS:900000}
    user-max: ${RATE_LIMIT_USER_MAX:600}
    auth-ip-window-ms: ${RATE_LIMIT_AUTH_IP_WINDOW_MS:900000}
    auth-ip-max: ${RATE_LIMIT_AUTH_IP_MAX:20}

spring:
  application:
    name: connect-maratha-api
  # spring.datasource.* comes from DATABASE_URL (see DatabaseUrlEnvironment).
  jpa:
    # Never create or alter tables: the schema belongs to the existing
    # PostgreSQL database that the Node backend also uses.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
