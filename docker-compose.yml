services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cm_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./database:/app/database

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cm_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
