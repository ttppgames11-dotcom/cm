# Sized for a 7.5 GB machine: larger heaps plus a separate Kotlin daemon caused
# repeated native out-of-memory JVM crashes (hs_err_pid*.log).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
