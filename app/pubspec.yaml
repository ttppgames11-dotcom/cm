name: app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  sentry_flutter: ^9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/avatars/
    # Fonts are bundled (google_fonts loads them from here; no runtime downloads).
    - google_fonts/

# App icon = the official Connect मराठा logo. Sources live in icon/ (not
# bundled into the app). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "icon/app_icon.png"
  adaptive_icon_background: "#FDF8F2"
  adaptive_icon_foreground: "icon/app_icon_foreground.png"

