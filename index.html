    // Keep body.top clean from Google Translate banner offset
    (function() {
      function cleanBodyTop() {
        if (document.body && (document.body.style.top !== '0px' && document.body.style.top !== '')) {
          document.body.style.top = '0px';
        }
        if (document.documentElement && document.documentElement.style.top) {
          document.documentElement.style.top = '0px';
        }
      }
      if (window.MutationObserver) {
        window.addEventListener('DOMContentLoaded', function() {
          cleanBodyTop();
          var observer = new MutationObserver(function() {
            cleanBodyTop();
          });
          observer.observe(document.body, { attributes: true, attributeFilter: ['style', 'class'] });
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
        });
      }
    })();
