<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>व्यवसाय प्रोफाईल — Connect Maratha</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  :root {
    --orange-50: #FFF7ED;
    --orange-100: #FFEDD5;
    --orange-200: #FED7AA;
    --orange-300: #FDBA74;
    --orange-400: #FB923C;
    --orange-500: #F97316;
    --orange-600: #EA580C;
    --orange-700: #C2410C;
    --orange-800: #9A3412;
    --orange-900: #7C2D12;
    --white: #FFFFFF;
    --gray-50: #FAFAFA;
    --gray-100: #F5F5F5;
    --gray-200: #E5E5E5;
    --gray-300: #D4D4D4;
    --gray-400: #A3A3A3;
    --gray-500: #737373;
    --gray-600: #525252;
    --gray-700: #404040;
    --gray-800: #262626;
    --gray-900: #171717;
  }

  .biz-hero {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 24px;
    background: linear-gradient(135deg, var(--orange-600) 0%, var(--orange-700) 50%, var(--orange-800) 100%);
    box-shadow: 0 20px 40px rgba(234, 88, 12, 0.25);
  }

  .biz-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0 L60 30 L30 60 L0 30 Z' fill='none' stroke='%23FFFFFF' stroke-width='0.5' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .biz-hero-content {
    position: relative;
    z-index: 2;
    padding: 32px;
    color: var(--white);
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-start;
  }

  .biz-hero-icon {
    width: 96px;
    height: 96px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }

  .biz-hero-main {
    flex: 1;
    min-width: 280px;
  }

  .biz-hero-category {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.2);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 10px;
    backdrop-filter: blur(8px);
  }

  .biz-hero-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 8px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  .biz-hero-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 0.9rem;
    opacity: 0.95;
    margin-bottom: 16px;
  }

  .biz-hero-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .biz-hero-rating {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.15);
    padding: 8px 16px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .biz-hero-rating .stars {
    font-size: 1.1rem;
    letter-spacing: 1px;
  }

  .biz-hero-rating .count {
    font-size: 0.85rem;
    opacity: 0.9;
  }

  .biz-hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }

  .biz-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9rem;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
  }

  .biz-btn-primary {
    background: var(--white);
    color: var(--orange-700);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  }

  .biz-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
  }

  .biz-btn-secondary {
    background: rgba(255, 255, 255, 0.15);
    color: var(--white);
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(8px);
  }

  .biz-btn-secondary:hover {
    background: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.5);
    transform: translateY(-2px);
  }

  .biz-btn-ghost {
    background: transparent;
    color: var(--white);
    border: 1.5px solid rgba(255, 255, 255, 0.3);
  }

  .biz-btn-ghost:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.5);
  }

  .biz-section {
    background: var(--white);
    border-radius: 16px;
    border: 1px solid var(--orange-100);
    box-shadow: 0 4px 16px rgba(234, 88, 12, 0.06);
    overflow: hidden;
    margin-bottom: 20px;
  }

  .biz-section-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--orange-100);
    background: var(--orange-50);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .biz-section-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--orange-800);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .biz-section-title::before {
    content: '';
    width: 4px;
    height: 24px;
    background: linear-gradient(180deg, var(--orange-500), var(--orange-700));
    border-radius: 2px;
  }

  .biz-section-body {
    padding: 24px;
  }

  .biz-grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  @media (max-width: 640px) {
    .biz-grid-2 { grid-template-columns: 1fr; }
  }

  .biz-info-card {
    background: var(--orange-50);
    border: 1px solid var(--orange-100);
    border-radius: 12px;
    padding: 18px;
    transition: all 0.2s ease;
  }

  .biz-info-card:hover {
    border-color: var(--orange-300);
    box-shadow: 0 6px 18px rgba(234, 88, 12, 0.1);
  }

  .biz-info-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--orange-600);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .biz-info-value {
    font-size: 0.95rem;
    color: var(--gray-800);
    font-weight: 500;
    line-height: 1.5;
  }

  .biz-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--white);
    border: 1px solid var(--orange-200);
    color: var(--orange-700);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    margin: 4px 6px 4px 0;
    transition: all 0.2s;
  }

  .biz-tag:hover {
    background: var(--orange-500);
    color: var(--white);
    border-color: var(--orange-500);
  }

  .biz-tag.primary {
    background: var(--orange-500);
    color: var(--white);
    border-color: var(--orange-500);
  }

  .biz-hours-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--orange-100);
  }

  .biz-hours-row:last-child {
    border-bottom: none;
  }

  .biz-hours-day {
    font-weight: 600;
    color: var(--gray-700);
  }

  .biz-hours-time {
    color: var(--gray-600);
    font-size: 0.9rem;
  }

  .biz-hours-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .biz-hours-status.open {
    background: #DCFCE7;
    color: #166534;
  }

  .biz-hours-status.closed {
    background: #FEF2F2;
    color: #991B1B;
  }

  .biz-review-card {
    padding: 16px 0;
    border-bottom: 1px solid var(--orange-100);
  }

  .biz-review-card:last-child {
    border-bottom: none;
  }

  .biz-review-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .biz-review-author {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .biz-review-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--orange-400), var(--orange-600));
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .biz-review-name {
    font-weight: 700;
    color: var(--gray-800);
  }

  .biz-review-date {
    font-size: 0.75rem;
    color: var(--gray-500);
  }

  .biz-review-stars {
    color: var(--orange-500);
    font-size: 0.95rem;
    letter-spacing: 1px;
  }

  .biz-review-text {
    color: var(--gray-700);
    line-height: 1.6;
    margin: 0;
  }

  .biz-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }

  .biz-gallery-item {
    aspect-ratio: 4/3;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--orange-200);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .biz-gallery-item:hover {
    transform: scale(1.02);
    box-shadow: 0 12px 28px rgba(234, 88, 12, 0.15);
    border-color: var(--orange-400);
  }

  .biz-gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }

  .biz-gallery-item:hover img {
    transform: scale(1.05);
  }

  .biz-map-container {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--orange-200);
    aspect-ratio: 16/9;
  }

  .biz-map-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--orange-50), var(--orange-100));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--orange-700);
  }

  .biz-map-placeholder svg {
    width: 48px;
    height: 48px;
    opacity: 0.6;
  }

  .biz-share-dropdown {
    position: relative;
    display: inline-block;
  }

  .biz-share-menu {
    position: absolute;
    bottom: 100%;
    right: 0;
    margin-bottom: 8px;
    background: var(--white);
    border: 1px solid var(--orange-200);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(234, 88, 12, 0.15);
    padding: 8px;
    display: none;
    flex-direction: column;
    gap: 4px;
    min-width: 160px;
    z-index: 50;
  }

  .biz-share-dropdown:hover .biz-share-menu,
  .biz-share-dropdown:focus-within .biz-share-menu {
    display: flex;
  }

  .biz-share-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gray-700);
    background: transparent;
    border: none;
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: all 0.15s;
  }

  .biz-share-item:hover {
    background: var(--orange-50);
    color: var(--orange-800);
  }

  .biz-offer-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--orange-500), var(--orange-600));
    color: var(--white);
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
    animation: pulse-glow 2s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3); }
    50% { box-shadow: 0 6px 20px rgba(234, 88, 12, 0.5); }
  }

  .biz-stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 20px 24px;
    background: linear-gradient(135deg, var(--orange-50), var(--orange-100));
    border-bottom: 1px solid var(--orange-200);
  }

  @media (max-width: 640px) {
    .biz-stats-bar { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }

  .biz-stat {
    text-align: center;
  }

  .biz-stat-value {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--orange-700);
    line-height: 1;
  }

  .biz-stat-label {
    font-size: 0.75rem;
    color: var(--orange-600);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .biz-related-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }

  .biz-related-card {
    background: var(--white);
    border: 1px solid var(--orange-100);
    border-radius: 14px;
    padding: 18px;
    text-decoration: none;
    color: inherit;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .biz-related-card:hover {
    border-color: var(--orange-400);
    box-shadow: 0 12px 28px rgba(234, 88, 12, 0.12);
    transform: translateY(-3px);
  }

  .biz-related-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--orange-400), var(--orange-600));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .biz-related-name {
    font-weight: 700;
    color: var(--gray-800);
    font-size: 0.95rem;
  }

  .biz-related-meta {
    display: flex;
    gap: 12px;
    font-size: 0.75rem;
    color: var(--gray-500);
  }

  .biz-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 16px;
    color: var(--gray-500);
  }

  .biz-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--orange-200);
    border-top-color: var(--orange-500);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .biz-not-found {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray-500);
  }

  .biz-not-found svg {
    width: 80px;
    height: 80px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .biz-review-form {
    display: grid;
    gap: 14px;
    padding-top: 16px;
    border-top: 1px solid var(--orange-200);
    margin-top: 16px;
  }

  .biz-review-form .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 480px) {
    .biz-review-form .field-row { grid-template-columns: 1fr; }
  }

  .biz-review-form label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--gray-700);
    margin-bottom: 4px;
    display: block;
  }

  .biz-review-form input,
  .biz-review-form select,
  .biz-review-form textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--orange-200);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--white);
    transition: all 0.2s;
  }

  .biz-review-form input:focus,
  .biz-review-form select:focus,
  .biz-review-form textarea:focus {
    outline: none;
    border-color: var(--orange-500);
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
  }

  .biz-review-form textarea {
    min-height: 80px;
    resize: vertical;
  }

  .biz-review-form .btn-submit {
    justify-self: start;
  }

  .biz-verified-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--orange-100);
    color: var(--orange-700);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    margin-left: 8px;
  }

  .biz-description {
    color: var(--gray-700);
    line-height: 1.7;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<div class="site-topbar">
  <div class="site-topbar-inner">

<header class="site-header">
  <div class="site-header-inner">

      <img src="assets/images/logo.png" alt="Connect Maratha Logo" class="brand-logo">
