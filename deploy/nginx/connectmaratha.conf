# Connect Maratha on a shared server whose Nginx owns ports 80/443.
# The main domain (connectmaratha.com) is hosted elsewhere (Vercel), so this
# server only answers for api.connectmaratha.com.
#
# Install / reinstall:
#   cp /opt/connect-maratha/deploy/nginx/connectmaratha.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.connectmaratha.com     (adds the 443 block + redirect)
#
# IMPORTANT for anyone maintaining this server: do not delete this file when
# redeploying other projects — the Connect Maratha app stops working.

server {
    listen 80;
    listen [::]:80;
    server_name api.connectmaratha.com;

    client_max_body_size 5m;

    # Public pages required by Google Play (privacy policy, account deletion,
    # terms). Served as static files from the deploy kit.
    location ~ ^/(privacy|delete-account|terms)/?$ {
        root /opt/connect-maratha/backend/public;
        default_type text/html;
        try_files /$1.html =404;
    }

    # Everything else goes to the API.
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
