# Production stack for a single VPS: PostgreSQL + API + Caddy (automatic HTTPS).
# Run from the deploy/ folder:  docker compose -f docker-compose.prod.yml up -d --build
# Secrets come from deploy/.env (git-ignored) - copy env.prod.example.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: connect_maratha
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: the database is reachable only from the api container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm_user -d connect_maratha"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://cm_user:${POSTGRES_PASSWORD}@postgres:5432/connect_maratha
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: 1
    volumes:
      # Legacy JSON collections are written next to server.js; keep them on the host.
      - ./data/db.json:/app/backend/db.json
      - ./data/data_oral_history.json:/app/backend/data_oral_history.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
