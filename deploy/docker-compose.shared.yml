# Shared-server variant: use when another project's web server (e.g. Nginx)
# already owns ports 80/443. No Caddy here — the host's Nginx proxies to the
# API, which listens on 127.0.0.1 only. PostgreSQL has no published port.
#   docker compose -f docker-compose.shared.yml up -d --build
# Nginx site: deploy/nginx/connectmaratha.conf
name: connect-maratha

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Caps so Connect Maratha can never take memory/CPU from epay on this shared server.
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: cm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: connect_maratha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm_user -d connect_maratha"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Caps so Connect Maratha can never take memory/CPU from epay on this shared server.
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://cm_user:${POSTGRES_PASSWORD}@postgres:5432/connect_maratha
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: 1
      # Forgot-password emails (Hostinger mailbox); without these no OTP can be sent.
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Extra signing-certificate SHA-256 values (Play app signing key) for App Links.
      ANDROID_APP_FINGERPRINTS: ${ANDROID_APP_FINGERPRINTS:-}
      RATE_LIMIT_PUBLIC_MAX: 1000
      RATE_LIMIT_AUTH_IP_MAX: 100
    ports:
      # Reachable only from this server (Nginx), never from the internet.
      - "127.0.0.1:${API_PORT:-5100}:5000"
    volumes:
      - ./data/db.json:/app/backend/db.json
      - ./data/data_oral_history.json:/app/backend/data_oral_history.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
